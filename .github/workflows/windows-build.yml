name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --info

      - name: Build Canvaas
        run: dotnet build src/Canvaas/Canvaas.csproj -c Release

      - name: Publish Canvaas (single Windows .exe, no .NET install needed)
        run: >
          dotnet publish src/Canvaas/Canvaas.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Check the .exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Canvaas.exe)) { throw "publish/Canvaas.exe was not created" }
          Get-Item publish/Canvaas.exe | Format-List Name, Length

      - name: Upload Canvaas.exe
        uses: actions/upload-artifact@v4
        with:
          name: Canvaas-windows-x64
          path: publish/Canvaas.exe
          if-no-files-found: error
